appId: com.dailyroutine.app
productName: Daily Routine
copyright: Copyright © 2026

directories:
  buildResources: build
  output: dist

# Exclusion-only list: electron-builder still starts from **/* and then applies these.
# `!src/*` would leave nested sources in the package; `**` removes the whole tree.
files:
  - '!**/.vscode/*'
  - '!.cursor/**'
  - '!.eslintcache'
  - '!src/**'
  - '!docs/**'
  - '!tests/**'
  - '!scripts/**'
  - '!resources/**'
  - '!*.md'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,eslint.config.mjs,.prettierrc.yaml,.prettierignore}'
  - '!vitest.config.*'

asar: true

extraResources:
  - from: resources/icon.png
    to: icon.png

win:
  executableName: daily-routine
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
